name: CI/CD for Next.js XM Cloud with Vercel

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    name: Build and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: |
          cd src/sxastarter
          npm ci

      - name: Run Linter
        run: |
          cd src/sxastarter
          npm run lint

      - name: Build Next.js App
        run: |
          cd src/sxastarter
          npm run build || { echo "Build failed"; exit 1; }

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: build
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel Environment Information
        run: |
          cd src/sxastarter
          vercel pull --yes --environment=production --token ${{ secrets.VERCEL_TOKEN }} --scope krunal120s-projects

      - name: Deploy to Vercel
        run: |
          cd src/sxastarter
          vercel --prod --token ${{ secrets.VERCEL_TOKEN }} --confirm --yes

